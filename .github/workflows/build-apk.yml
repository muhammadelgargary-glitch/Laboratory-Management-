name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Add Android
        run: npx cap add android

      - name: Generate Android App Icons
        run: |
          npm install --no-save @capacitor/assets
          mkdir -p resources
          cp assets/icon.png resources/icon.png
          npx capacitor-assets generate --android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Restore Fixed Google OAuth Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/laboratory-management-release.keystore

          test -s android/app/laboratory-management-release.keystore

          echo "Fixed keystore restored successfully."

      - name: Configure Android Debug Signing
        working-directory: android
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle")
          text = p.read_text()

          signing = '''    signingConfigs {
              debug {
                  storeFile file("laboratory-management-release.keystore")
                  storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                  keyAlias System.getenv("ANDROID_KEY_ALIAS")
                  keyPassword System.getenv("ANDROID_KEY_PASSWORD")
              }
          }

          '''

          if "signingConfigs {" not in text:
              text = text.replace("android {\n", "android {\n" + signing, 1)
          else:
              raise SystemExit("Unexpected existing signingConfigs block; stopping to avoid modifying the wrong configuration.")

          p.write_text(text)
          PY

      - name: Set Signing Environment
        run: |
          echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Show Fixed SHA-1
        run: |
          echo "===== FIXED KEY SHA-1 ====="

          keytool -list -v \
            -keystore android/app/laboratory-management-release.keystore \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -alias "${{ secrets.ANDROID_KEY_ALIAS }}" | grep -E "Alias name:|SHA1:|SHA-1:"

      - name: Show Android Signing Report
        working-directory: android
        run: |
          ./gradlew signingReport

      - name: Build Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug

      - name: Verify APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          echo "APK created successfully."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: laboratory-management-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
