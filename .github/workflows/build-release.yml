name: Build Release AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Add Android
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Restore Fixed Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/laboratory-management-release.keystore
          test -s android/app/laboratory-management-release.keystore

      - name: Set Signing Environment
        run: |
          echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Configure Release Signing
        working-directory: android
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle")
          text = p.read_text()

          signing = '''    signingConfigs {
              release {
                  storeFile file("laboratory-management-release.keystore")
                  storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                  keyAlias System.getenv("ANDROID_KEY_ALIAS")
                  keyPassword System.getenv("ANDROID_KEY_PASSWORD")
              }
          }

          '''

          if "signingConfigs {" not in text:
              text = text.replace("android {\n", "android {\n" + signing, 1)
          else:
              raise SystemExit("Unexpected existing signingConfigs block; stopping.")

          text = text.replace(
              "buildTypes {",
              '''buildTypes {
          release {
              signingConfig signingConfigs.release
          }
          ''',
              1
          )

          p.write_text(text)
          PY

      - name: Show Signing SHA-1
        run: |
          keytool -list -v \
            -keystore android/app/laboratory-management-release.keystore \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -alias "${{ secrets.ANDROID_KEY_ALIAS }}" | grep -E "Alias name:|SHA1:|SHA-1:"

      - name: Build Release AAB
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Verify AAB
        run: |
          test -f android/app/build/outputs/bundle/release/app-release.aab
          echo "Release AAB created successfully."

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: laboratory-management-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
