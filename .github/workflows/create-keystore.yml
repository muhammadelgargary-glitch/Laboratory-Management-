name: Create Fixed Android Keystore

on:
  workflow_dispatch:

jobs:
  create:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Generate Fixed Keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore laboratory-management-release.keystore \
            -storepass "LabManagement2026!" \
            -alias laboratory \
            -keypass "LabManagement2026!" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Laboratory Management,O=Laboratory Management,C=IQ"

      - name: Show SHA-1
        run: |
          keytool -list -v \
            -keystore laboratory-management-release.keystore \
            -storepass "LabManagement2026!" \
            -alias laboratory | grep -E "SHA1:|SHA-1:"

      - name: Upload Keystore
        uses: actions/upload-artifact@v4
        with:
          name: laboratory-management-keystore
          path: laboratory-management-release.keystore
